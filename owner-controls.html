<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Visit controls | AI Toolbox</title><style>body{font:18px/1.6 system-ui;background:#f7f8fc;color:#151827;margin:0}main{max-width:600px;margin:60px auto;padding:24px}button,a{font:inherit}button{padding:14px 20px;border:0;border-radius:9px;background:#5145cd;color:white;cursor:pointer;margin:8px 8px 8px 0}button:focus-visible,a:focus-visible{outline:3px solid #111;outline-offset:4px}.secondary{background:#e5e3f9;color:#151827}</style></head><body><main><h1>Exclude your own visits</h1><p>Use this on each browser you use to check AI Toolbox. It stops this site from loading Google Analytics on that browser. It does not remove past visits or apply to another device, private browsing window, or browser.</p><p id="status" role="status" aria-live="polite"></p><button id="exclude">Exclude my visits</button><button id="include" class="secondary">Include my visits</button><p><a href="index.html">Back to AI Toolbox</a></p></main><script>
const status = document.getElementById('status');
function show(){try{status.textContent=localStorage.getItem('aitoolbox_internal')==='1'?'Your visits are excluded on this browser.':'Your visits are included on this browser.';}catch{status.textContent='Browser storage is unavailable. Exclusion cannot be saved.';}}
function set(value){try{localStorage.setItem('aitoolbox_internal',value);show();}catch{status.textContent='Could not save this setting. Allow browser storage and try again.';}}
document.getElementById('exclude').addEventListener('click',()=>set('1'));
document.getElementById('include').addEventListener('click',()=>set('0'));
show();
</script></body></html>
